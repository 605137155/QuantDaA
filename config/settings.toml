[app]
timezone = "Asia/Shanghai"
demo_mode = false
ignore_env_proxy = true
enable_auto_open_fusion_window = true


[database]
path = "data/app.db"

[scan]
pool_refresh_seconds = 60
signal_scan_seconds = 30
intraday_candidate_refresh_seconds = 15
monitor_pool_size = 100
focus_pool_size = 30
# 是否启用信号扫描（关闭可避免启动卡顿）
enable_signal_scan = false
# 是否启用盘中候选自动刷新（关闭可避免卡顿）
enable_intraday_candidate_auto_refresh = false

[market]
exclude_st = true
exclude_etf = true
exclude_convertible = true
enable_bj = false

[alert]
default_cooldown_minutes = 20
enable_console = true

[hot_score]
# 是否启用同花顺热门榜单数据
enable_ths = true
# 24小时热榜加分
ths_hourly_hot_bonus = 15
# 价值投资热榜加分
ths_value_hot_bonus = 10
# 同花顺数据自动刷新间隔（秒）
ths_refresh_seconds = 60
[candidate]
weights_path = "config/candidate_weights.toml"
active_weight_profile = "auto"
