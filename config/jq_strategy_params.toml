    { name = "B: 涨幅4~7% | 竞昨比10~20%", open_lo = 1.04, open_hi = 1.07, auc_lo = 0.1, auc_hi = 0.2 },
    { name = "B: 涨幅0~4% | 竞昨比3~7%", open_lo = 1.0, open_hi = 1.04, auc_lo = 0.03, auc_hi = 0.07 },
